name: Quality

# CI 只做信号，不做部署 —— 部署仍走本地 Mac 的 rsync 流程。
# main 未开分支保护，所以红灯不阻塞 merge。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: typecheck (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [xiaodada, store, forum]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      - run: npm run typecheck
        working-directory: apps/${{ matrix.app }}

  tdz-scan:
    name: TDZ 依赖数组扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-tdz-deps.mjs apps

  build:
    name: build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [xiaodada, store, forum]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: apps/${{ matrix.app }}
      - run: npm run build
        working-directory: apps/${{ matrix.app }}
